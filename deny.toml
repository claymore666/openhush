# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates - only warn for workspace deps (direct dependencies)
unmaintained = "workspace"
# Yanked crates - warn but don't fail
yanked = "warn"
# Ignored advisories.
#
# cargo-deny and cargo-audit read separate config files and apply different
# policies, so they need different lists. `unmaintained = "workspace"` above
# means cargo-deny only reports unmaintained crates that are direct
# dependencies, so every unmaintained advisory we hit transitively is already
# silent here and listing it would just be an unused entry -- the previous
# "RUSTSEC-2024-0415" line was exactly that. cargo-audit has no such policy
# knob and reports all of them, so .cargo/audit.toml carries the full list
# with the reasoning for each. That file is the authority; this one only needs
# what cargo-deny genuinely acts on.
ignore = [
    # glib VariantStrIter unsoundness. Reached through
    # tray-icon -> muda/libappindicator -> gtk3 bindings. tray-icon is a
    # Windows/macOS-only dependency here, so this code is never compiled on
    # any target OpenHush ships, and upstream has no gtk3-compatible fix.
    # Unlike the unmaintained notices, "unsound" is not filtered by the
    # workspace policy, so this entry is load-bearing.
    "RUSTSEC-2024-0429",
]

[licenses]
# All licenses are denied unless explicitly listed in allow
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # Additional OSI-approved licenses from dependencies
    "BSL-1.0",               # Boost Software License (clipboard-win, error-code)
    "OFL-1.1",               # SIL Open Font License (epaint_default_fonts)
    "Unicode-3.0",           # Unicode License v3 (icu_* crates)
    "NCSA",                  # UIUC/NCSA Open Source License (libfuzzer-sys via rav1e)
    "Unlicense",             # The Unlicense (whisper-rs, whisper-rs-sys)
    "CDLA-Permissive-2.0",   # Community Data License (webpki-root-certs)
]
confidence-threshold = 0.8

# Clarify licenses for crates with non-standard license expressions
[[licenses.clarify]]
name = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny specific crates
deny = [
    # Example: { name = "openssl" }  # Prefer rustls
]

# Skip duplicate version checks for these
skip = [
    # Example: { name = "syn", version = "1.0" }
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
