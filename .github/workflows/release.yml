name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-x86_64
            cross: false

          # TODO: Re-enable when cross-rs images are fixed
          # # Linux x86_64 (musl - static)
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-22.04
          #   name: linux-x86_64-musl
          #   cross: true
          #
          # # Linux aarch64 (ARM64)
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04
          #   name: linux-aarch64
          #   cross: true

          # macOS x86_64 (Intel) - cross-compiled on ARM runner
          - target: x86_64-apple-darwin
            os: macos-14
            name: macos-x86_64
            cross: false

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            name: macos-aarch64
            cross: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpulse-dev

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 &>/dev/null || brew install openssl@3

      # Windows dependencies
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install openssl

      # Install cross for cross-compilation
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Build (native)
      - name: Build (native)
        if: ${{ !matrix.cross && runner.os != 'macOS' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (native macOS)
        if: ${{ !matrix.cross && runner.os == 'macOS' }}
        run: |
          # Homebrew on ARM is /opt/homebrew, on Intel is /usr/local
          if [ -d "/opt/homebrew/opt/openssl@3" ]; then
            export OPENSSL_DIR="/opt/homebrew/opt/openssl@3"
          else
            export OPENSSL_DIR="/usr/local/opt/openssl@3"
          fi
          cargo build --release --target ${{ matrix.target }}

      # Build (cross-compilation)
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # Package (Unix)
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/openhush dist/
          chmod +x dist/openhush
          cd dist && tar -czvf ../openhush-${{ github.ref_name }}-${{ matrix.name }}.tar.gz *

      # Package (Windows)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/openhush.exe" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "openhush-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openhush-${{ matrix.name }}
          path: openhush-${{ github.ref_name }}-${{ matrix.name }}.*
          if-no-files-found: error

  # ===================
  # Linux Packages (.deb)
  # ===================
  package-linux:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: openhush-linux-x86_64
          path: artifact

      - name: Extract binary
        run: |
          cd artifact
          tar xzf openhush-*.tar.gz
          chmod +x openhush

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev
          # dpkg-shlibdeps resolves each NEEDED library to the package that
          # ships it, which requires those packages to be installed here.
          # Without them it cannot see the dependency at all.
          sudo apt-get install -y \
            libasound2 \
            libdbus-1-3 \
            libpulse0 \
            libx11-6 \
            libxtst6 \
            libssl3

      # The package definition lives in packaging/, not here. Keeping it inline
      # meant it could only ever be exercised by pushing a tag; that is how
      # v0.8.0 shipped a .deb whose Depends had drifted from what the binary
      # links against. Run the same script locally to reproduce this artifact.
      - name: Build .deb package
        run: |
          packaging/deb/build-deb.sh "${{ github.ref_name }}" artifact/openhush .

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: openhush-deb
          path: openhush-*.deb
          if-no-files-found: error

  # ==========================
  # Verify Linux Package (.deb)
  # ==========================
  # A green package-linux job only proves a file was produced. v0.8.0
  # shipped a .deb that installed cleanly and then refused to start
  # because its Depends were incomplete. This gate installs the package
  # in clean containers and runs the binary before anything is released.
  verify-linux-package:
    needs: package-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: openhush-deb
          path: artifact

      - name: Install and run the package in clean containers
        run: |
          chmod +x packaging/verify-deb.sh
          packaging/verify-deb.sh artifact/openhush-*.deb

  # ===================
  # macOS Package (.dmg)
  # ===================
  package-macos:
    needs: build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openhush-macos-*
          path: artifacts
          merge-multiple: false

      - name: Create universal binary
        run: |
          # Extract both architectures
          mkdir -p x86_64 aarch64
          cd artifacts/openhush-macos-x86_64 && tar xzf openhush-*.tar.gz && mv openhush ../../x86_64/
          cd ../openhush-macos-aarch64 && tar xzf openhush-*.tar.gz && mv openhush ../../aarch64/
          cd ../..

          # Create universal binary with lipo
          lipo -create -output openhush x86_64/openhush aarch64/openhush
          chmod +x openhush

      # Same reasoning as the .deb: one definition, in packaging/, runnable
      # by hand. The inline copy this replaces had drifted from
      # packaging/macos/build-dmg.sh, and it was the inline one that shipped —
      # so a fix landed in the script while users kept getting the stale plist.
      - name: Build DMG
        run: |
          packaging/macos/build-dmg.sh "${{ github.ref_name }}" openhush .

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: openhush-dmg
          path: openhush-*.dmg
          if-no-files-found: error

  # ===================
  # Windows Package (.msi)
  # ===================
  package-windows:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: openhush-windows-x86_64
          path: artifact

      - name: Extract binary
        shell: pwsh
        run: |
          Expand-Archive -Path artifact\openhush-*.zip -DestinationPath artifact\extracted

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pinned deliberately: an unpinned install is what silently moved
          # this job onto a new major version mid-release.
          dotnet tool install --global wix --version 7.0.0
          # v7 refuses to run until the Open Source Maintenance Fee EULA is
          # accepted (WIX7015). Accepted for this project by the maintainer;
          # the fee itself applies only above US$10,000 annual revenue.
          wix eula accept wix7
          # WixUI_Minimal lives in the UI extension, which is not built in.
          wix extension add -g WixToolset.UI.wixext/7.0.0

      - name: Build MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''

          # Copy binary to packaging dir
          Copy-Item "artifact\extracted\openhush.exe" -Destination "packaging\windows\"

          # Create LICENSE.rtf
          $license = Get-Content "LICENSE" -Raw
          $rtf = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Consolas;}}\f0\fs20 $($license -replace "`n", "\par ")}"
          $rtf | Out-File -FilePath "packaging\windows\LICENSE.rtf" -Encoding ASCII

          # Build MSI
          cd packaging\windows
          wix build openhush.wxs `
              -ext WixToolset.UI.wixext `
              -d SourceDir="." `
              -d Version="$version" `
              -o "..\..\openhush-${{ github.ref_name }}-x64.msi"

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: openhush-msi
          path: openhush-*.msi
          if-no-files-found: error

  # ===================
  # Create GitHub Release
  # ===================
  release:
    needs: [build, package-linux, verify-linux-package, package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          # Binary tarballs/zips
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          # Distribution packages
          find artifacts -type f \( -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          mv checksums.txt openhush-${{ github.ref_name }}-checksums.txt
          cat openhush-${{ github.ref_name }}-checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.dmg
            release/*.msi
            release/*-checksums.txt
          generate_release_notes: true
          # Created unpublished so the artifacts can be checked before they
          # reach anyone. Publish from the Releases page once they look right.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
